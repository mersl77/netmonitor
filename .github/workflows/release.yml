# Sestavení a vydání NetMonitoru pro Windows, Linux a macOS (Intel i Apple Silicon).
# Spuštění:
#   a) push na main se zvýšenou verzí v src/netmonitor/__init__.py => koncept release v<verze> se založí sám
#      (poznámky z CHANGELOG.md); pokud release té verze už existuje, doplní se chybějící platformy
#   b) vytvořením release / tagu "v*" na GitHubu
#   c) ručně: Actions → Build & Release → Run workflow → zadat existující tag (např. v1.0.1);
#      postaví a nahraje jen chybějící platformy (kompletní zveřejněný release se nepřestaví)
# Každý build nahraje své soubory PŘÍMO do release – nepoužívá Actions artefakty
# (ty mají u soukromých repozitářů omezenou kvótu úložiště; assety release se do ní nepočítají).
# Před buildem se na každé platformě spustí kompletní testy.
# Nový release vzniká jako koncept a zveřejní se až po úspěšném buildu všech platforem.
# Staví se z commitu vydané verze (tag, u konceptu bez tagu jeho cílový commit).
name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existující tag (např. v1.0.1); doplní se jen chybějící platformy"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
      missing: ${{ steps.v.outputs.missing }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          NEW_VERSION=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/netmonitor/__init__.py').read()).group(1))")
            TAG="v$VER"
            NEW_VERSION=true
          fi
          if [[ "$TAG" != v?* ]]; then
            echo "::error::Neplatný tag '$TAG' (očekává se např. v1.0.1)."
            exit 1
          fi
          BUILD=true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Endpoint commits rozbalí i anotovaný tag; koncept bez tagu má vlastní cílový commit.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
            else
              TARGET=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')
              if [ -z "$TARGET" ]; then
                echo "::error::Release $TAG nemá cílový commit."
                exit 1
              fi
              SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET" --jq '.sha')
            fi
            # Release existuje – doplní se jen platformy, jejichž soubory v něm chybí.
            NAMES=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            MISSING=""
            grep -q -- '-setup\.exe$' <<<"$NAMES" || MISSING="$MISSING windows-x64"
            grep -q -- 'linux-x86_64\.tar\.gz$' <<<"$NAMES" || MISSING="$MISSING linux-x86_64"
            grep -q -- 'macos-arm64\.dmg$' <<<"$NAMES" || MISSING="$MISSING macos-arm64"
            grep -q -- 'macos-x86_64\.dmg$' <<<"$NAMES" || MISSING="$MISSING macos-x86_64"
            IS_DRAFT=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [ -z "$MISSING" ] && [ "$IS_DRAFT" != "true" ]; then
              echo "Release $TAG už existuje a je kompletní – nic nevydávám."
              BUILD=false
            else
              # Kompletní koncept potřebuje zopakovat publish, buildy se s prázdným MISSING přeskočí.
              echo "Release $TAG existuje, pokračuji ve vydání (chybějící platformy:$MISSING)."
            fi
          else
            SHA=""
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
              SHA="$TAG_SHA"
              if [ "$NEW_VERSION" = "true" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::Tag $TAG ukazuje na $TAG_SHA místo očekávaného $GITHUB_SHA; zkontrolujte tag, případně spusťte Actions → Build & Release → Run workflow s tagem."
                exit 1
              fi
            elif [ "$NEW_VERSION" != "true" ]; then
              echo "::error::Tag $TAG neexistuje; pro push tagu nebo ruční spuštění musí tag existovat."
              exit 1
            fi
            if [ "$NEW_VERSION" = "true" ]; then
              SHA="$GITHUB_SHA"
            fi
            if [ -z "$SHA" ]; then
              echo "::error::Nelze určit commit pro release $TAG (prázdné SHA)."
              exit 1
            fi
            VER="${TAG#v}"
            python3 scripts/changelog_section.py "$VER" > notes.md
            # Tag se samostatně nezakládá; při zveřejnění jej vytvoří Releases API.
            # U tagového/ručního běhu je existence tagu ověřena výše, --target připne přesný commit.
            if [ "$NEW_VERSION" = "true" ]; then
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "NetMonitor $VER" --notes-file notes.md
            else
              gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$SHA" --title "NetMonitor $VER" --notes-file notes.md
            fi
            MISSING="windows-x64 linux-x86_64 macos-arm64 macos-x86_64"
          fi
          if [ -z "$SHA" ]; then
            echo "::error::Nelze určit commit pro release $TAG (prázdné SHA)."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "build=$BUILD"
            echo "missing=$MISSING"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04          # starší glibc => běží i na Debian 12 / Ubuntu 22.04+
            name: linux-x86_64
          - os: macos-latest          # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel        # Intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      # tato platforma se staví jen tehdy, když její soubory v release chybí
      DO_BUILD: ${{ contains(format(' {0} ', needs.prepare.outputs.missing), format(' {0} ', matrix.name)) }}
    steps:
      - uses: actions/checkout@v5
        if: env.DO_BUILD == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        if: env.DO_BUILD == 'true'
        with:
          python-version: "3.13"

      - name: Linux – systémové knihovny Qt
        if: env.DO_BUILD == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1 iputils-ping

      - name: Windows – Inno Setup
        if: env.DO_BUILD == 'true' && runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build (Windows)
        if: env.DO_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Build (Linux)
        if: env.DO_BUILD == 'true' && runner.os == 'Linux'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_linux.sh --deb

      - name: Build (macOS)
        if: env.DO_BUILD == 'true' && runner.os == 'macOS'
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./scripts/build_macos.sh --dmg

      - name: Nahrát do release
        if: env.DO_BUILD == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*-setup.exe dist/*.tar.gz dist/*.deb dist/*.dmg)
          [ ${#files[@]} -gt 0 ] || { echo "Žádné soubory k nahrání"; exit 1; }
          printf 'Nahrávám: %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Zveřejnit až po úspěchu všech platforem
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          NAMES=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          MISSING=""
          grep -q -- '-setup\.exe$' <<<"$NAMES" || MISSING="$MISSING windows-x64"
          grep -q -- 'linux-x86_64\.tar\.gz$' <<<"$NAMES" || MISSING="$MISSING linux-x86_64"
          grep -q -- 'macos-arm64\.dmg$' <<<"$NAMES" || MISSING="$MISSING macos-arm64"
          grep -q -- 'macos-x86_64\.dmg$' <<<"$NAMES" || MISSING="$MISSING macos-x86_64"
          if [ -n "$MISSING" ]; then
            echo "::error::Release $TAG není kompletní, chybí:$MISSING"
            exit 1
          fi
          IS_DRAFT=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            # --target připne nově vznikající tag k postavenému commitu; existující tag API ponechá.
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --target "$SHA"
          fi
