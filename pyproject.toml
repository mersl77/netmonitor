[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netmonitor"
version = "1.3.4"
description = "NetMonitor – nativní desktopový widget pro sledování sítě a dostupnosti cílů (ICMP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Marceli Zelina" }]
dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3"]

[project.scripts]
netmonitor = "netmonitor.main:main"

[project.gui-scripts]
netmonitor-gui = "netmonitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netmonitor = [
    "resources/fonts/*.ttf",
    "resources/fonts/OFL-*.txt",
    "resources/icons/*.png",
    "resources/icons/*.ico",
    "resources/icons/*.icns",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: testy se skutečným ICMP / OS (přeskočí se, kde to prostředí nedovolí)"]
